version: '3.8'

services:
  hiops-db:
    image: postgres:16-alpine
    container_name: hiops-postgres
    restart: always
    environment:
      POSTGRES_DB: hiops
      POSTGRES_USER: hiops
      POSTGRES_PASSWORD: hiops
    volumes:
      - hiops_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiops -d hiops"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  hiops-web:
    image: hiops-web:v2.0
    container_name: hiops-platform
    restart: always
    depends_on:
      hiops-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=hiops-db;Port=5432;Database=hiops;Username=hiops;Password=hiops
      - AllowedHosts=*
    ports:
      - "8088:8080"

volumes:
  hiops_pgdata:
